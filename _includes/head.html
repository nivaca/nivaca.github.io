<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  {% seo %}

  <script>
    // Apply a saved light/dark choice before the page paints, then let the
    // header button toggle it. Without a saved choice the system setting wins.
    (function () {
      var root = document.documentElement;
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") root.dataset.theme = saved;
      } catch (e) {}

      document.addEventListener("click", function (event) {
        if (!event.target.closest(".theme-toggle")) return;
        var current = root.dataset.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var next = current === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>

  <link rel="icon" href="{{ "/images/favicon.ico" | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.5/css/academicons.min.css">

  <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}?v={{ site.time | date: "%s" }}">
</head>
