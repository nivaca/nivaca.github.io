<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  {% seo %}
  {%- if page.ref %}
  {%- for l in site_langs %}{% if alt_found[forloop.index0] == "y" %}
  <link rel="alternate" hreflang="{{ l }}" href="{{ alt_urls[forloop.index0] | absolute_url }}">
  {%- endif %}{% endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ alt_urls[0] | absolute_url }}">
  {%- endif %}

  <script>
    // Apply a saved light/dark choice before the page paints, then let the
    // header button toggle it. Without a saved choice the system setting wins.
    (function () {
      var root = document.documentElement;
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") root.dataset.theme = saved;
      } catch (e) {}

      document.addEventListener("click", function (event) {
        if (!event.target.closest(".theme-toggle")) return;
        var current = root.dataset.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var next = current === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
      });

      // Close the language menu on a click elsewhere or on Escape.
      function closeLangMenus(except) {
        document.querySelectorAll("details.lang-menu[open]").forEach(function (d) {
          if (d !== except) d.removeAttribute("open");
        });
      }
      document.addEventListener("click", function (event) {
        closeLangMenus(event.target.closest("details.lang-menu"));
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeLangMenus(null);
      });

      // Open the language menu towards the side that has room: leftwards
      // from the button, unless that would run off the screen (on phones,
      // where the buttons wrap to the left edge). Decided on the click,
      // before the menu is drawn.
      document.addEventListener("click", function (event) {
        var summary = event.target.closest("details.lang-menu > summary");
        if (!summary) return;
        // The closed menu has no width to measure; 150px covers its 7.5rem.
        summary.parentNode.classList.toggle("open-right", summary.getBoundingClientRect().right < 150);
      });
    })();
  </script>

  <link rel="icon" href="{{ "/images/favicon.ico" | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.5/css/academicons.min.css">

  <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}?v={{ site.time | date: "%s" }}">
</head>
