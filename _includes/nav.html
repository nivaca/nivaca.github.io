<nav class="site-nav" aria-label="{% if lang == "es" %}Principal{% else %}Main{% endif %}">
  <ul>
    {% for item in site.data.menu[lang] %}
    <li><a href="{{ item.href | relative_url }}"{% if page.url == item.href %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
    {% endfor %}
  </ul>
</nav>
