<footer class="site-footer">

    <div class="footer-grid">
      <div>
        <p class="footer-name"><a href="{{ site.profile_url }}">{{ site.title }}</a></p>
        <p>{{ site.jobtitle }}<br>

      {% include profile-links.html %}

</footer>
